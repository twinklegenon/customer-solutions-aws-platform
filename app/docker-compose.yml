# Local test of the app with PostgreSQL and Redis. Run: docker compose up --build
# Then open http://localhost:8080
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: app
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_TLS: "false"
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
